name: Refresh Lottery History

# Runs the scraper on a schedule and commits history.json if it changed, so the
# app can fetch a URL that's always reasonably current.
#
# SETUP (one-time, done by you - Claude cannot deploy/host this):
#   1. Put this file at .github/workflows/refresh-lottery.yml in your repo
#      (the "lottery-scraper" folder, including scraper.js, should sit at the
#      repo root or wherever you point the `working-directory` below).
#   2. Push to GitHub. That's it - no secrets or extra config needed for a
#      public repo, since this only reads a public webpage and writes back to
#      your own repo using the built-in GITHUB_TOKEN.
#   3. The resulting history.json becomes readable at:
#        https://raw.githubusercontent.com/<you>/<repo>/main/lottery-scraper/history.json
#      That URL sends permissive CORS headers, so the app's browser-side
#      fetch() can read it directly - no separate API server needed.
#
# BUG FIX (this version): the "Commit history.json if changed" step previously
# used `git diff --quiet -- <path>`, which only compares TRACKED files against
# the index - it does NOT detect brand-new, never-before-committed files (git
# doesn't know to diff something it isn't tracking yet). This meant that on
# the very first run (and only the first run), a freshly-generated
# history.json would be silently treated as "no change - nothing to commit"
# and never actually pushed, even though the scraper itself ran successfully
# with no errors - the exact "workflow succeeds, but the file never appears
# in the repo" symptom this fixes. The fix is to `git add` first, then check
# `git diff --cached --quiet` instead, which correctly compares the STAGED
# content against HEAD and detects new files as a real difference.
#
# SCHEDULE NOTE: Singapore Pools draws 4D on Wed/Sat/Sun and TOTO on Mon/Thu,
# both around 6:30pm SGT (= 10:30am UTC). The cron below runs a few times after
# each draw window to catch the update without hammering the source site.

on:
  schedule:
    # 12:00, 14:00, 22:00 UTC daily (= 8pm, 10pm, 6am SGT) - covers the post-draw
    # window with a little buffer for the mirror site to update, plus a morning
    # catch-up run. Adjust freely; GitHub's cron scheduling can drift by a few
    # minutes at busy times, which doesn't matter for this use case.
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run scraper
        working-directory: lottery-scraper
        run: node scraper.js

      - name: Verify scraper output (diagnostic - shows up in every run's log)
        working-directory: lottery-scraper
        run: |
          if [ -f history.json ]; then
            echo "history.json exists. Size: $(wc -c < history.json) bytes."
            echo "Draw counts: $(node -e "const h=require('./history.json'); console.log('4D:', h.fourD.length, '| TOTO:', h.toto.length)")"
          else
            echo "::warning::history.json was NOT created by the scraper step - check the 'Run scraper' step's log above for the specific fetch/parse failure (the scraper logs detailed warnings, including response body snippets, rather than failing silently)."
          fi

      - name: Commit history.json if changed
        run: |
          git config user.name "lottery-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f lottery-scraper/history.json ]; then
            echo "::error::history.json does not exist - nothing to commit. See the 'Run scraper' and 'Verify scraper output' steps above for why."
            exit 1
          fi
          git add lottery-scraper/history.json
          if git diff --cached --quiet; then
            echo "No change in history.json - nothing to commit."
          else
            git commit -m "Auto-refresh lottery results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
