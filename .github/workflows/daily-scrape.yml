name: Daily Job Scrape

# Runs on GitHub's own servers — nothing runs on your computer, nothing is
# hosted anywhere public. Free tier for private repos: 2,000 minutes/month;
# this job takes well under a minute per run.

on:
  schedule:
    # 00:00 UTC = 08:00 Singapore time (SGT is UTC+8). Adjust if you want
    # a different time — cron is in UTC, not local time.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit results back to the repo

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python3 scraper.py

      - name: Run match report (only if a new CSV was produced today)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          CSV_PATH="output/jobs_${TODAY}.csv"
          if [ -f "$CSV_PATH" ]; then
            python3 match_report.py "$CSV_PATH"
          else
            echo "No new postings today — skipping match report."
          fi

      - name: Commit and push results
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Daily job scrape: $(date -u +%Y-%m-%d)"
          git push
